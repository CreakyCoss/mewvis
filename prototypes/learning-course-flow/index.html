<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学习工坊 · 课程创建流程原型</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./prototype.js" defer></script>
  </head>
  <body>
    <div class="library-background" aria-hidden="true">
      <div class="library-top"><strong>学习工坊</strong><span>我的课程</span><span>创建课程</span></div>
      <div class="library-ghost"><small>我的课程</small><h1>继续你的学习计划</h1><p>课程、项目与学习进度都在这里。</p></div>
    </div>

    <main class="workspace" role="dialog" aria-modal="true" aria-labelledby="workspace-title">
      <header class="workspace-header">
        <div class="workspace-brand"><span>学习工坊 <b>/</b> 课程创建</span></div>
        <div class="header-right"><span class="prototype-tag">设计稿 · V3</span><button class="icon-button" type="button" id="close-workspace" aria-label="关闭预览">×</button></div>
      </header>

      <nav class="stepper" aria-label="创建课程步骤">
        <button type="button" data-step="0"><span class="step-number">01</span><span class="step-copy"><strong>课程设置</strong><small>主题与结构</small></span></button>
        <button type="button" data-step="1"><span class="step-number">02</span><span class="step-copy"><strong>课程大纲</strong><small>只读预览</small></span></button>
        <button type="button" data-step="2"><span class="step-number">03</span><span class="step-copy"><strong>课时内容</strong><small>统一维护课时</small></span></button>
        <button type="button" data-step="3"><span class="step-number">04</span><span class="step-copy"><strong>项目实训</strong><small>可选的实践环节</small></span></button>
      </nav>

      <div class="workspace-content" id="screen"></div>

      <footer class="workspace-footer">
        <button type="button" class="button secondary" id="previous">上一步</button>
        <div class="footer-actions">
          <button type="button" class="button quiet" id="stash">暂存</button>
          <button type="button" class="button primary" id="next">下一步</button>
        </div>
      </footer>
    </main>

    <div id="outline-overlay" class="overlay" hidden>
      <section class="outline-dialog" role="dialog" aria-modal="true" aria-labelledby="outline-dialog-title">
        <header class="outline-dialog-header"><div><span class="eyebrow">课程大纲</span><h2 id="outline-dialog-title">编辑课程大纲</h2><p>从零理解数据分析</p></div><button type="button" class="icon-button" id="close-outline" aria-label="关闭大纲编辑">×</button></header>
        <form id="outline-form">
          <div class="outline-form-scroll">
            <div class="outline-ai-row"><div><strong>AI 辅助规划</strong><p>以当前填写的内容为基础生成或优化，预览后再采用。</p></div><button type="button" class="button small secondary" data-design-action="AI 优化大纲">AI 优化大纲</button></div>
            <div class="form-group"><label for="outline-description">课程简介</label><textarea id="outline-description" rows="3">从真实问题出发，理解数据整理、描述与分析的基本方法，并能够用清晰的图表解释发现。</textarea></div>
            <div class="form-group"><label for="outline-goal">课程目标</label><textarea id="outline-goal" rows="3">学会从实际问题出发，整理数据、识别关键信息，并清楚表达分析结论。</textarea></div>
            <div class="outline-phase-heading"><h3>学习路径</h3><button type="button" class="button small secondary" data-design-action="添加阶段">添加阶段</button></div>
            <ol class="outline-phase-fields"><li><span>01</span><div><input aria-label="第 1 阶段名称" value="提出可分析的问题" /><textarea aria-label="第 1 阶段说明" rows="2">明确问题边界、需要的数据与判断依据。</textarea></div><button type="button" data-design-action="移除阶段">移除</button></li><li><span>02</span><div><input aria-label="第 2 阶段名称" value="建立可靠的分析基础" /><textarea aria-label="第 2 阶段说明" rows="2">理解数据来源，完成整理与基础描述。</textarea></div><button type="button" data-design-action="移除阶段">移除</button></li><li><span>03</span><div><input aria-label="第 3 阶段名称" value="解释发现并提出建议" /><textarea aria-label="第 3 阶段说明" rows="2">选择合适的表达方式，区分观察与推断。</textarea></div><button type="button" data-design-action="移除阶段">移除</button></li></ol>
          </div>
          <footer class="outline-dialog-footer"><button type="button" class="button secondary" id="cancel-outline">取消</button><button type="submit" class="button primary">保存大纲</button></footer>
        </form>
      </section>
    </div>

    <div id="lesson-overlay" class="overlay" hidden>
      <section class="lesson-dialog" role="dialog" aria-modal="true" aria-labelledby="lesson-dialog-title">
        <header class="lesson-dialog-header"><div><span class="eyebrow">课时内容</span><h2 id="lesson-dialog-title">编辑课时</h2></div><button type="button" class="icon-button" id="close-lesson" aria-label="关闭课时编辑">×</button></header>
        <form id="lesson-form">
          <div class="lesson-form-scroll">
            <nav class="lesson-section-nav" aria-label="课时编辑区域"><a href="#proto-lesson-basics">课时信息</a><a href="#proto-lesson-content">教学内容</a><a href="#proto-lesson-quiz">课后测验</a></nav>
            <div class="lesson-form-main">
              <div class="lesson-ai-panel"><strong>AI 辅助创建</strong><p id="lesson-ai-intro">根据课程主题及已填写的信息生成完整课时。</p><label for="lesson-ai-instruction">补充要求（选填）</label><div class="lesson-ai-composer"><textarea id="lesson-ai-instruction" rows="2" placeholder="例如：面向零基础，加入一步步操作的示例…"></textarea><button type="button" class="button primary small" id="lesson-ai-action">生成课时</button></div></div>
              <section id="proto-lesson-basics" class="lesson-form-section"><h3>课时信息</h3><div class="form-group"><label for="lesson-title">课时标题</label><input id="lesson-title" required maxlength="120" /></div><div class="form-group"><label for="lesson-objective">学习目标</label><textarea id="lesson-objective" required rows="2" maxlength="500"></textarea></div></section>
              <section id="proto-lesson-content" class="lesson-form-section"><h3>教学内容</h3><div class="form-group"><label for="lesson-body">课时正文</label><textarea id="lesson-body" required rows="7" placeholder="从核心概念、关键方法和实际操作开始写起…"></textarea></div><div class="form-group"><label for="lesson-example">具体示例</label><textarea id="lesson-example" required rows="3" placeholder="用一个贴近实际的例子解释本课内容…"></textarea></div><div class="form-group"><label for="lesson-takeaways">知识要点（每行一条，1–6 条）</label><textarea id="lesson-takeaways" required rows="3"></textarea></div></section>
              <section id="proto-lesson-quiz" class="lesson-form-section"><h3>课后测验 <small>1–3 道题，每题 1 分</small></h3><div class="lesson-quiz-card"><strong>第 1 题</strong><div class="form-group"><label for="lesson-quiz">题干</label><input id="lesson-quiz" required placeholder="例如：本课的核心概念是什么？" /></div><div class="form-group"><label for="lesson-option-a">选项 A</label><input id="lesson-option-a" required /></div><div class="form-group"><label for="lesson-option-b">选项 B</label><input id="lesson-option-b" required /></div><div class="form-group"><label>正确答案</label><label class="lesson-answer"><input type="radio" name="lesson-answer" required /> A</label><label class="lesson-answer"><input type="radio" name="lesson-answer" required /> B</label></div></div></section>
            </div>
          </div>
          <footer class="lesson-dialog-footer"><div><button type="button" class="button secondary" id="cancel-lesson">取消</button><button type="submit" class="button primary">保存</button></div></footer>
        </form>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
