<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/startup-cat-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mewvis</title>
    <style>
      :root {
        color-scheme: light;
        --startup-bg: #fff2cf;
        --startup-ink: #090909;
        --startup-lane: #e6cf98;
        --startup-lane-fill: #f6b72a;
        --startup-lane-fill-glow: rgb(246 183 42 / 34%);
        --startup-gold: #d98b00;
        --startup-gold-bright: #ffc64a;
        --startup-title-start: #fffdf6;
        --startup-cat-shadow: rgb(75 46 16 / 18%);
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: var(--startup-bg);
      }

      body {
        color: var(--startup-ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .startup-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        overflow: hidden;
        background: var(--startup-bg);
        color: var(--startup-ink);
      }

      .startup-screen__content {
        display: flex;
        width: min(480px, calc(100vw - 80px));
        transform: translateY(16px);
        flex-direction: column;
        align-items: center;
      }

      .startup-screen__brand {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      .startup-screen__logo {
        width: 78px;
        height: 78px;
        flex: 0 0 auto;
        color: var(--startup-ink);
        object-fit: contain;
      }

      .startup-screen__brand-name {
        position: relative;
        z-index: 0;
        margin: 0;
        color: transparent;
        background: linear-gradient(
          90deg,
          var(--startup-gold) 0%,
          var(--startup-gold-bright) 48%,
          var(--startup-title-start) 52%,
          var(--startup-title-start) 100%
        );
        background-position: 100% 50%;
        background-size: 200% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        font-size: 52px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: 0;
        -webkit-text-fill-color: transparent;
        text-shadow:
          0 1px 0 rgb(111 67 10 / 16%),
          0 0 0 rgb(246 183 42 / 0%);
        animation: startup-brand-gold 5s linear forwards;
      }

      .startup-screen__brand-name::before,
      .startup-screen__brand-name::after {
        content: "";
        position: absolute;
        inset: -20px -30px;
        z-index: -1;
        opacity: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 8% 38%, var(--startup-gold-bright) 0 1.3px, transparent 1.6px),
          radial-gradient(circle at 18% 76%, var(--startup-lane-fill) 0 1px, transparent 1.3px),
          radial-gradient(circle at 44% 4%, var(--startup-gold-bright) 0 1.2px, transparent 1.5px),
          radial-gradient(circle at 78% 14%, var(--startup-lane-fill) 0 1.35px, transparent 1.65px),
          radial-gradient(circle at 92% 54%, var(--startup-gold-bright) 0 1px, transparent 1.3px),
          radial-gradient(circle at 68% 90%, var(--startup-lane-fill) 0 1.15px, transparent 1.45px);
        filter: drop-shadow(0 0 6px var(--startup-lane-fill-glow));
      }

      .startup-screen__brand-name::after {
        inset: -26px -38px;
        background:
          radial-gradient(circle at 4% 64%, var(--startup-lane-fill) 0 1.1px, transparent 1.4px),
          radial-gradient(circle at 26% 16%, var(--startup-gold-bright) 0 1px, transparent 1.3px),
          radial-gradient(circle at 62% 2%, var(--startup-lane-fill) 0 1.2px, transparent 1.5px),
          radial-gradient(circle at 98% 34%, var(--startup-gold-bright) 0 1.25px, transparent 1.55px),
          radial-gradient(circle at 86% 84%, var(--startup-lane-fill) 0 1px, transparent 1.3px);
      }

      .startup-screen--complete .startup-screen__brand-name::before {
        animation:
          startup-brand-stardust 1s ease-out forwards,
          startup-brand-twinkle 0.85s ease-in-out 0.15s infinite;
      }

      .startup-screen--complete .startup-screen__brand-name::after {
        animation:
          startup-brand-stardust 1s ease-out 0.08s forwards,
          startup-brand-twinkle 0.95s ease-in-out 0.2s infinite;
      }

      .startup-screen__cat-progress {
        position: relative;
        width: min(464px, 100%);
        height: 48px;
        margin-top: 22px;
        overflow: hidden;
      }

      .startup-screen__cat-lane {
        --startup-lane-bottom: 1px;
        --startup-lane-thickness: 5px;
        --startup-head-width: 46px;
        --startup-progress-run: 5s;
        container-type: inline-size;
        isolation: isolate;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 18px;
      }

      .startup-screen__cat-lane::before {
        content: "";
        position: absolute;
        right: 0;
        bottom: calc(var(--startup-lane-bottom) + 10px);
        left: 0;
        z-index: 0;
        height: var(--startup-lane-thickness);
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 28%), transparent 58%),
          linear-gradient(
            90deg,
            transparent,
            var(--startup-lane) 12%,
            var(--startup-lane) 88%,
            transparent
          );
        box-shadow:
          0 1px 0 rgb(255 255 255 / 30%) inset,
          0 -1px 0 rgb(85 53 13 / 10%) inset;
      }

      .startup-screen__lane-fill,
      .startup-screen__paw-trail,
      .startup-screen__lane-head {
        position: absolute;
        pointer-events: none;
      }

      .startup-screen__lane-fill {
        z-index: 1;
        right: calc(var(--startup-head-width) * 0.5);
        bottom: calc(var(--startup-lane-bottom) + 10px);
        left: 0;
        height: var(--startup-lane-thickness);
        border-radius: 999px;
        background: var(--startup-lane-fill);
        box-shadow:
          0 0 7px var(--startup-lane-fill-glow),
          0 1px 0 rgb(255 255 255 / 30%) inset;
        transform: scaleX(0);
        transform-origin: 0 50%;
        animation: startup-lane-fill var(--startup-progress-run) linear forwards;
      }

      .startup-screen__paw-trail {
        z-index: 2;
        right: calc(var(--startup-head-width) * 0.5);
        bottom: calc(var(--startup-lane-bottom) + 14px);
        left: 0;
        height: 12px;
        opacity: 0;
        background-image:
          radial-gradient(ellipse at 8px 8px, rgb(158 89 6 / 70%) 0 2px, transparent 2.2px),
          radial-gradient(circle at 13px 5px, rgb(158 89 6 / 70%) 0 1.2px, transparent 1.4px),
          radial-gradient(circle at 17px 6px, rgb(158 89 6 / 70%) 0 1.2px, transparent 1.4px),
          radial-gradient(circle at 20px 8px, rgb(158 89 6 / 70%) 0 1.2px, transparent 1.4px);
        background-repeat: repeat-x;
        background-size: 34px 12px;
        clip-path: inset(0 100% 0 0);
        animation: startup-paw-trail var(--startup-progress-run) linear forwards;
      }

      .startup-screen__lane-head {
        z-index: 3;
        bottom: calc(var(--startup-lane-bottom) + 8px);
        left: 0;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #ffe28a;
        box-shadow:
          -10px -4px 0 -2px rgb(245 158 11 / 72%),
          -6px 5px 0 -2px rgb(245 158 11 / 72%),
          0 0 12px var(--startup-lane-fill-glow);
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.72);
        animation: startup-lane-head var(--startup-progress-run) linear forwards;
      }

      .startup-screen__lane-head::before {
        content: "";
        position: absolute;
        bottom: -3px;
        left: -4px;
        width: 22px;
        height: 18px;
        background:
          radial-gradient(circle at 14px 2px, #ffd56a 0 1.5px, transparent 1.7px),
          radial-gradient(circle at 4px 10px, #f59e0b 0 1.5px, transparent 1.7px),
          radial-gradient(circle at 18px 14px, #f59e0b 0 1.3px, transparent 1.5px);
        animation: startup-lane-twinkle 0.7s ease-in-out infinite;
      }

      .startup-screen__cat-walker {
        --startup-cat-width: 46px;
        --startup-cat-height: 26px;
        --startup-cat-start-offset: 0px;
        --startup-cat-end-offset: 0px;
        --startup-cat-y-offset: 0px;
        position: absolute;
        bottom: 15px;
        left: 0;
        display: block;
        width: var(--startup-cat-width);
        height: var(--startup-cat-height);
        opacity: 0;
        transform: translate3d(
          calc((var(--startup-cat-width) * -1.18) - var(--startup-cat-start-offset)),
          0,
          0
        );
        will-change: transform, opacity;
        animation: startup-cat-travel var(--startup-progress-run) linear forwards;
      }

      .startup-screen__cat-walker--mewvis {
        --startup-cat-y-offset: 1px;
        z-index: 6;
      }

      .startup-screen__cat-walker--lihua {
        --startup-cat-start-offset: 45px;
        --startup-cat-end-offset: 45px;
        --startup-cat-y-offset: 1px;
        z-index: 5;
      }

      .startup-screen__cat-walker--orange {
        --startup-cat-start-offset: 90px;
        --startup-cat-end-offset: 90px;
        --startup-cat-y-offset: 1px;
        z-index: 4;
      }

      .startup-screen__cat-walker::before {
        content: "";
        position: absolute;
        right: 12%;
        bottom: -1px;
        left: 12%;
        height: 3px;
        border-radius: 999px;
        background: var(--startup-cat-shadow);
        filter: blur(2px);
        transform-origin: 50% 50%;
      }

      .startup-screen__cat-sprite {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        transform-origin: 50% 84%;
        transform: translate3d(0, var(--startup-cat-y-offset), 0);
      }

      .startup-screen__cat-walker--lihua .startup-screen__cat-sheet {
        animation-delay: 0.12s;
      }

      .startup-screen__cat-walker--orange .startup-screen__cat-sheet {
        animation-delay: 0.24s;
      }

      .startup-screen__cat-sheet {
        display: block;
        width: 600%;
        height: 100%;
        max-width: none;
        object-fit: fill;
        pointer-events: none;
        will-change: transform;
        animation: startup-cat-frames 0.84s steps(5, end) infinite;
      }

      .startup-screen__cat-name {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .startup-screen__status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      @keyframes startup-cat-travel {
        0% {
          transform: translate3d(
            calc((var(--startup-cat-width) * -1.18) - var(--startup-cat-start-offset)),
            0,
            0
          );
          opacity: 0;
        }
        6% {
          opacity: 1;
        }
        100% {
          transform: translate3d(
            calc(100cqw - var(--startup-cat-width) - var(--startup-cat-end-offset)),
            0,
            0
          );
          opacity: 1;
        }
      }

      @keyframes startup-cat-frames {
        0% {
          transform: translateX(0);
        }
        to {
          transform: translateX(-83.333333%);
        }
      }

      @keyframes startup-lane-fill {
        0%,
        12% {
          transform: scaleX(0);
          opacity: 0;
        }
        16% {
          opacity: 1;
        }
        100% {
          transform: scaleX(1);
          opacity: 1;
        }
      }

      @keyframes startup-paw-trail {
        0%,
        14% {
          clip-path: inset(0 100% 0 0);
          opacity: 0;
        }
        20% {
          opacity: 0.95;
        }
        100% {
          clip-path: inset(0 0 0 0);
          opacity: 0.95;
        }
      }

      @keyframes startup-lane-head {
        0%,
        12% {
          opacity: 0;
          transform: translate3d(0, 0, 0) scale(0.62);
        }
        16% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          transform: translate3d(calc(100cqw - var(--startup-head-width) * 0.5 - 7px), 0, 0)
            scale(0.9);
        }
      }

      @keyframes startup-lane-twinkle {
        50% {
          filter: brightness(1.3);
        }
      }

      @keyframes startup-brand-gold {
        0%,
        12% {
          background-position: 100% 50%;
          text-shadow:
            0 1px 0 rgb(111 67 10 / 16%),
            0 0 0 rgb(246 183 42 / 0%);
        }
        86%,
        100% {
          background-position: 0% 50%;
          text-shadow:
            0 1px 0 rgb(112 65 0 / 18%),
            0 0 12px rgb(246 183 42 / 34%),
            0 0 22px rgb(246 183 42 / 18%);
        }
      }

      @keyframes startup-brand-stardust {
        0% {
          opacity: 0;
          transform: scale(0.94) rotate(-2deg);
        }
        42% {
          opacity: 0.95;
        }
        100% {
          opacity: 0.72;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes startup-brand-twinkle {
        50% {
          filter: drop-shadow(0 0 9px var(--startup-lane-fill-glow)) brightness(1.2);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --startup-bg: #17120a;
          --startup-ink: #fff7e4;
          --startup-lane: #4a3a18;
          --startup-lane-fill: #d99a18;
          --startup-lane-fill-glow: rgb(217 154 24 / 28%);
          --startup-gold: #ffbe3d;
          --startup-gold-bright: #ffe08a;
          --startup-title-start: #fffdf6;
          --startup-cat-shadow: rgb(0 0 0 / 34%);
        }
      }

      @media (max-width: 640px) {
        .startup-screen__content {
          width: min(360px, calc(100vw - 48px));
        }

        .startup-screen__brand {
          gap: 18px;
        }

        .startup-screen__logo {
          width: 60px;
          height: 60px;
        }

        .startup-screen__brand-name {
          font-size: 38px;
        }

        .startup-screen__cat-progress {
          height: 38px;
          margin-top: 18px;
        }

        .startup-screen__cat-lane {
          --startup-lane-thickness: 4px;
          --startup-head-width: 34px;
        }

        .startup-screen__paw-trail {
          bottom: calc(var(--startup-lane-bottom) + 12px);
          height: 11px;
          background-size: 32px 11px;
        }

        .startup-screen__lane-head {
          bottom: calc(var(--startup-lane-bottom) + 7px);
          width: 6px;
          height: 6px;
        }

        .startup-screen__cat-walker {
          --startup-cat-width: 34px;
          --startup-cat-height: 19px;
          bottom: 14px;
        }

        .startup-screen__cat-walker--mewvis {
          --startup-cat-y-offset: 0.75px;
        }

        .startup-screen__cat-walker--lihua,
        .startup-screen__cat-walker--orange {
          --startup-cat-y-offset: 0.75px;
        }

        .startup-screen__cat-walker--lihua {
          --startup-cat-start-offset: 35px;
          --startup-cat-end-offset: 35px;
        }

        .startup-screen__cat-walker--orange {
          --startup-cat-start-offset: 70px;
          --startup-cat-end-offset: 70px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-screen__cat-walker {
          left: var(--startup-cat-static-left);
          opacity: 1;
          transform: translateX(-50%);
          animation: none;
        }

        .startup-screen__cat-walker--mewvis {
          --startup-cat-static-left: 22%;
        }

        .startup-screen__cat-walker--lihua {
          --startup-cat-static-left: 50%;
        }

        .startup-screen__cat-walker--orange {
          --startup-cat-static-left: 78%;
        }

        .startup-screen__cat-sprite,
        .startup-screen__cat-sheet {
          animation: none;
        }

        .startup-screen__cat-walker::before {
          animation: none;
        }

        .startup-screen__brand-name {
          background-position: 0% 50%;
          animation: none;
        }

        .startup-screen__brand-name::before,
        .startup-screen__brand-name::after,
        .startup-screen__lane-head::before {
          opacity: 0.72;
          animation: none;
        }

        .startup-screen__lane-fill {
          transform: scaleX(0.18);
          opacity: 1;
          animation: none;
        }

        .startup-screen__paw-trail {
          clip-path: inset(0 82% 0 0);
          opacity: 0.75;
          animation: none;
        }

        .startup-screen__lane-head {
          opacity: 1;
          transform: translate3d(18cqw, 0, 0) scale(0.85);
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"><main class="startup-screen" aria-busy="true" aria-label="Mewvis 正在启动"><section class="startup-screen__content"><div class="startup-screen__brand"><img class="startup-screen__logo" src="/assets/startup-cat-icon.png" alt="" aria-hidden="true" /><h1 class="startup-screen__brand-name">Mewvis</h1></div><div class="startup-screen__cat-progress" aria-hidden="true"><div class="startup-screen__cat-lane"><span class="startup-screen__lane-fill"></span><span class="startup-screen__paw-trail"></span><span class="startup-screen__lane-head"></span><span class="startup-screen__cat-walker startup-screen__cat-walker--mewvis"><span class="startup-screen__cat-sprite"><img class="startup-screen__cat-sheet" src="/assets/startup-cats/spritesheets/mewvis-walk.png" alt="" /></span><span class="startup-screen__cat-name">Mewvis</span></span><span class="startup-screen__cat-walker startup-screen__cat-walker--lihua"><span class="startup-screen__cat-sprite"><img class="startup-screen__cat-sheet" src="/assets/startup-cats/spritesheets/lihua-walk.png" alt="" /></span><span class="startup-screen__cat-name">狸花猫</span></span><span class="startup-screen__cat-walker startup-screen__cat-walker--orange"><span class="startup-screen__cat-sprite"><img class="startup-screen__cat-sheet" src="/assets/startup-cats/spritesheets/orange-walk.png" alt="" /></span><span class="startup-screen__cat-name">橘猫</span></span></div></div><div class="startup-screen__status">正在初始化配置数据库</div></section></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
