<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/startup-cat-icon.png" />
    <link rel="preload" as="image" href="/assets/startup/mewvis-i-dot.png" />
    <link rel="preload" as="image" href="/assets/startup/mewvis-i-dot.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mewvis</title>
    <script>
      try {
        const startupTheme = new URLSearchParams(window.location.search).get("startup-theme");
        const storedTheme = window.localStorage.getItem("theme");
        const followsDarkSystem = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.startupTheme =
          startupTheme === "light" || startupTheme === "dark"
            ? startupTheme
            : storedTheme === "dark" || (storedTheme !== "light" && followsDarkSystem)
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.startupTheme = "light";
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --startup-bg: #f7f8fc;
        --startup-ink: #23232d;
        --startup-muted: #656978;
        --startup-overlay: rgb(247 248 252 / 84%);
        --startup-teal: #5a56d6;
      }

      :root[data-startup-theme="dark"] {
        color-scheme: dark;
        --startup-bg: #171720;
        --startup-ink: #f4f4f8;
        --startup-muted: #a9abb7;
        --startup-overlay: rgb(23 23 32 / 90%);
        --startup-teal: #a8a4ff;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: var(--startup-bg);
      }

      body {
        color: var(--startup-ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .startup-welcome {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background-color: var(--startup-bg);
        background-image:
          linear-gradient(var(--startup-overlay), var(--startup-overlay)), url("/assets/startup/startup-paper-bg.png");
        background-position: center;
        background-size: cover;
        color: var(--startup-ink);
      }

      .startup-welcome__content {
        display: flex;
        width: min(760px, calc(100vw - 64px));
        transform: translateY(36px);
        flex-direction: column;
        align-items: center;
        animation: startup-content-in 220ms ease-out both;
        text-align: center;
      }

      .startup-welcome__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .startup-welcome__brand-name {
        margin: 0;
        color: var(--startup-teal);
        font-size: clamp(52px, 8.44vw, 108px);
        line-height: 0.9;
        font-weight: 790;
        letter-spacing: -0.02em;
      }

      .startup-welcome__brand-i {
        position: relative;
        display: inline-block;
      }

      .startup-welcome__brand-i-letter {
        display: inline-block;
        clip-path: inset(32% 0 0);
      }

      .startup-welcome__brand-i-dot {
        position: absolute;
        top: 0.035em;
        left: 50%;
        display: block;
        width: 0.17em;
        height: 0.17em;
        transform: translateX(-50%);
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }

      .startup-welcome__tagline {
        margin: clamp(20px, 2vw, 25px) 0 0;
        color: var(--startup-muted);
        font-size: clamp(14px, 1.56vw, 20px);
        line-height: 1.45;
        font-weight: 470;
        letter-spacing: 0.15em;
      }

      .startup-welcome__status {
        display: inline-flex;
        min-height: 24px;
        margin-top: clamp(42px, 4.7vw, 60px);
        align-items: center;
        gap: 10px;
        color: var(--startup-muted);
        font-size: clamp(12px, 1.1vw, 14px);
        line-height: 1;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      .startup-welcome__status-dot {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--startup-teal);
        animation: startup-status-pulse 900ms ease-in-out infinite alternate;
      }

      .startup-welcome--complete .startup-welcome__status-dot {
        animation: none;
      }

      @keyframes startup-content-in {
        from {
          opacity: 0;
          transform: translateY(42px) scale(0.992);
        }

        to {
          opacity: 1;
          transform: translateY(36px) scale(1);
        }
      }

      @keyframes startup-status-pulse {
        from {
          opacity: 0.45;
        }

        to {
          opacity: 1;
        }
      }

      @media (max-width: 560px) {
        .startup-welcome__content {
          width: min(440px, calc(100vw - 40px));
        }

        .startup-welcome__brand-name {
          font-size: 48px;
        }

        .startup-welcome__tagline {
          font-size: 14px;
        }
      }

      @media (max-width: 420px) {
        .startup-welcome__brand-name {
          font-size: 42px;
        }

        .startup-welcome__tagline {
          letter-spacing: 0.1em;
        }
      }

      @media (max-height: 620px) {
        .startup-welcome__content {
          transform: translateY(8px);
        }

        .startup-welcome__status {
          margin-top: 32px;
        }

        @keyframes startup-content-in {
          from {
            opacity: 0;
            transform: translateY(14px) scale(0.992);
          }

          to {
            opacity: 1;
            transform: translateY(8px) scale(1);
          }
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-welcome__content,
        .startup-welcome__status-dot {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="startup-welcome" aria-busy="true" aria-label="Mewvis 正在启动">
        <section class="startup-welcome__content">
          <header class="startup-welcome__brand">
            <h1 class="startup-welcome__brand-name" aria-label="Mewvis"><span aria-hidden="true">Mewv</span><span class="startup-welcome__brand-i" aria-hidden="true"><span class="startup-welcome__brand-i-letter">i</span><img class="startup-welcome__brand-i-dot" src="/assets/startup/mewvis-i-dot.png" alt="" width="256" height="256" decoding="sync" /></span><span aria-hidden="true">s</span></h1>
            <p class="startup-welcome__tagline">你的 AI 工作伙伴</p>
          </header>

          <div class="startup-welcome__status" role="status" aria-live="polite">
            <span class="startup-welcome__status-dot" aria-hidden="true"></span>
            <span>正在准备创作空间</span>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
